name: Backend Integration Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  pytest-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
      
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4
    
    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.14.4'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'
      
    - name: Install System and Python Dependencies
      run: |
        python -m pip install --upgrade pip
        # FIXED: Added python-dotenv to prevent ModuleNotFoundError
        pip install pytest httpx httpx2 pydantic fastapi sqlalchemy PyJWT email-validator python-dotenv
    
    - name: Create Inline Environment Configuration
      run: |
        echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> $GITHUB_ENV

    - name: Execute Test Cases
      run: |
        python -m pytest test/test_auth.py -v
